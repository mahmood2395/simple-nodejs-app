name: CI Pipeline

# --- Trigger ---
# This pipeline runs on every push or pull request to the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    # The type of virtual machine GitHub spins up to run your pipeline
    runs-on: ubuntu-latest

    # --- Spin up a PostgreSQL container alongside the VM ---
    # This is GitHub's built-in way to run services during CI
    # It's similar to what docker-compose does locally
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: psql
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Wait until postgres is actually ready before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1 — Check out your code onto the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Node.js on the VM
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm' # caches node_modules between runs for speed

      # Step 3 — Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4 — Create the users table in the CI database
      # The VM needs psql installed and the table needs to exist before tests run
      - name: Set up database
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U psql -d test -c "
            CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              email VARCHAR(100) NOT NULL UNIQUE
            );"

      # Step 5 — Run your tests
      # Environment variables are injected so the app connects to the CI postgres
      - name: Run tests
        env:
          DB_USER: psql
          DB_HOST: 127.0.0.1
          DB_NAME: test
          DB_PASSWORD: secret
          DB_PORT: 5432
        run: npm test

  build:
    name: Build Docker Image
    # Only runs if the test job passes
    needs: test
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Check out code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Build the Docker image
      # This makes sure your Dockerfile has no errors
      - name: Build Docker image
        run: docker build -t simple-nodejs-app .